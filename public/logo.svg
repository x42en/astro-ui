<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Deep-space gradient backdrop -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6ea8fe" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="stroke" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9bb8ff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="32" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b6cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b6cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#glow)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" stroke="url(#ring)" stroke-width="1"/>

  <!-- Pinpoint stars -->
  <circle cx="14" cy="14" r="0.9" fill="#e2e8f0" opacity="0.9"/>
  <circle cx="50" cy="12" r="0.6" fill="#cbd5f5" opacity="0.7"/>
  <circle cx="52" cy="22" r="0.5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="11" cy="48" r="0.7" fill="#e2e8f0" opacity="0.85"/>
  <circle cx="20" cy="22" r="0.45" fill="#94a3b8" opacity="0.55"/>

  <!-- Lucide Telescope (24×24) scaled to 32×32 and centred at (32,32) -->
  <g transform="translate(16 16) scale(1.333)"
     stroke="url(#stroke)" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="m10.065 12.493-6.18 1.318a.934.934 0 0 1-1.108-.702l-.537-2.15a1.07 1.07 0 0 1 .691-1.265l13.504-4.44"/>
    <path d="m13.56 11.747 4.332-.924"/>
    <path d="m16 21-3.105-6.21"/>
    <path d="M16.485 5.94a2 2 0 0 1 1.455-2.425l1.09-.272a1 1 0 0 1 1.212.727l1.515 6.06a1 1 0 0 1-.727 1.213l-1.09.272a2 2 0 0 1-2.425-1.455z"/>
    <path d="m6.158 8.633 1.114 4.456"/>
    <path d="m8 21 3.105-6.21"/>
    <circle cx="12" cy="21" r="1" fill="url(#stroke)"/>
  </g>
</svg>
