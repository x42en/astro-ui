name: Build Nightly Docker Image

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        required: true
        default: "develop"
        type: string

env:
  REGISTRY: ghcr.io
  # github.repository preserves the original casing (e.g. "BitsDiver/astro-ui").
  # OCI registries require lowercase — use the lowercased form everywhere below.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  nightly:
    name: Build & Push nightly tag
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}

      - name: Build and push nightly image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Always overwrites the single `nightly` tag
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:nightly
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.ref.name=${{ inputs.branch }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api/v1' }}
            VITE_WS_BASE_URL=${{ vars.VITE_WS_BASE_URL || '' }}
            VITE_AUTH_MODE=${{ vars.VITE_AUTH_MODE || 'disabled' }}
            VITE_OIDC_AUTHORITY=${{ vars.VITE_OIDC_AUTHORITY || 'https://auth.astromote.com' }}
            VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID || 'astrostack' }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
